name: "CI Completo Site-epsoft"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  php-teste:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Validar PHP
        run: |
          php -v
          find . -type f -name "*.php" -exec php -l {} \;

  gitleaks-scan:
    runs-on: ubuntu-latest
    needs: php-teste
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2.3.9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          format: sarif
          output: gitleaks-results.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: gitleaks-results.sarif

  phpstan-scan:
    runs-on: ubuntu-latest
    needs: php-teste
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Setup PHPStan
        run: |
          curl -sS https://getcomposer.org/installer | php
          php composer.phar require --dev phpstan/phpstan

      - name: Run PHPStan
        run: |
          ./vendor/bin/phpstan analyse src --level=max

  deploy-site:
    runs-on: ubuntu-latest
    needs: [php-teste, gitleaks-scan, phpstan-scan]
    environment:
      name: site
    steps:
      - name: Repo Checkout
        uses: actions/checkout@v3

      - name: Site Deployment
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.KEY_SECRETORIGINAL }}
          ARGS: "-avz --no-owner --no-group --no-times --no-perms --delete"
          SOURCE: "./"
          REMOTE_HOST: ${{ vars.REMOTE_HOST }}
          REMOTE_USER: ${{ vars.REMOTE_USER }}
          REMOTE_PORT: ${{ vars.REMOTE_PORT }}
          TARGET: ${{ vars.TARGET }}
