name: "CI Completo Site-epsoft"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # Job para checagem e teste de PHP
  php-teste:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Validar PHP
        run: |
          php -v
          # Valida sintaxe de todos os arquivos PHP
          find . -type f -name "*.php" -exec php -l {} \;

  # Job para rodar Gitleaks
  gitleaks-scan:
    runs-on: ubuntu-latest
    needs: php-teste
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Run Gitleaks
        uses: zricethezav/gitleaks-action@v8
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # Job para rodar CodeQL
  codeql-scan:
    runs-on: ubuntu-latest
    needs: php-teste
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: "javascript,php"
      
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Scan
        uses: github/codeql-action/analyze@v3

  # Job para PHPStan (análise estática)
  phpstan-scan:
    runs-on: ubuntu-latest
    needs: php-teste
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Setup Composer
        run: |
          curl -sS https://getcomposer.org/installer | php
          php composer.phar require --dev phpstan/phpstan

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse src --level=max

  # Job de deploy
  deploy-site:
    runs-on: ubuntu-latest
    needs: [php-teste, gitleaks-scan, phpstan-scan, codeql-scan]
    environment:
      name: site
    steps:
      - name: Repo Checkout
        uses: actions/checkout@v3

      - name: Site Deployment
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.KEY_SECRETORIGINAL }}
          ARGS: "-avz --no-owner --no-group --no-times --no-perms --delete"
          SOURCE: "./"
          REMOTE_HOST: ${{ vars.REMOTE_HOST }}
          REMOTE_USER: ${{ vars.REMOTE_USER }}
          REMOTE_PORT: ${{ vars.REMOTE_PORT }}
          TARGET: ${{ vars.TARGET }}
