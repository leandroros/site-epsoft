name: "CI Completo Site-epsoft"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  php-teste:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Validar PHP
        run: |
          php -v
          php -l **/*.php

  gitleaks-scan:
    runs-on: ubuntu-latest
    needs: php-teste
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Gitleaks Scan
        uses: zricethezav/gitleaks-action@v8
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          format: sarif
          output: gitleaks-results.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: gitleaks-results.sarif

  codeql-scan:
    runs-on: ubuntu-latest
    needs: php-teste
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, php

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  deploy-site:
    runs-on: ubuntu-latest
    needs: [php-teste, gitleaks-scan, codeql-scan]
    environment:
      name: site
    steps:
      - name: Repo Checkout
        uses: actions/checkout@v3

      - name: Site Deployment
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.KEY_SECRETORIGINAL }}
          ARGS: "-avz --no-owner --no-group --no-times --no-perms --delete"
          SOURCE: "./"
          REMOTE_HOST: ${{ vars.REMOTE_HOST }}
          REMOTE_USER: ${{ vars.REMOTE_USER }}
          REMOTE_PORT: ${{ vars.REMOTE_PORT }}
          TARGET: ${{ vars.TARGET }}
